<!doctype html><meta charset="utf-8"><title>Conversation speech sequence regression tests</title>
<!-- Deterministic speech events; no microphone, speech service or transaction API calls. -->
<textarea id="text-input"></textarea><button id="send-btn">Send</button><button id="mic-btn">Tap to talk</button>
<p id="voice-status"></p><p id="voice-preview"></p><div id="draft-display"></div><pre id="test-results">Running</pre>
<script>
var spoken=[],active=0,overlaps=0,cancels=0,timers=new Map(),next=0;
window.setTimeout=(fn,ms)=>{timers.set(++next,fn);return next};window.clearTimeout=id=>timers.delete(id);
window.SpeechRecognition=undefined;window.webkitSpeechRecognition=undefined;
window.SpeechSynthesisUtterance=class{constructor(text){this.text=text}};
Object.defineProperty(window,'speechSynthesis',{value:{speak(u){if(active)overlaps++;active++;spoken.push(u);u.onstart()},cancel(){active=0;cancels++}},configurable:true});
function ended(){active=0;spoken.at(-1).onend()}
</script>
<script src="../js/voice.js"></script><script src="../js/ambiguity.js"></script>
<script>
(async function(){
 var results=[];function assert(x,message){if(!x)throw Error(message)}
 function test(name,fn){try{fn();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}}
 DctaVoice.init();var display=document.getElementById('draft-display');
 var draft={id:'known',amount:{value:'30.00',currency:'SGD'},payee:{id:'jane',display_name:'Jane Tan',masked_account:'****5678'},source_account:'source'};
 var validator={verdict:'pass'},policy={decision:'allow'};
 function known(index,verdict){var c=document.createElement('div');c.innerHTML='<p class="draft-core">Jane 30.00 SGD hash untouched</p>';display.append(c);var v=verdict||validator;DctaVoice.attachDraftReadback(c,draft,false,index,v,policy);return {card:c,draft,validator:v,policy,index,anchor:c.querySelector('.js-draft-readback')}}
 function ambiguous(index){var c=document.createElement('div');c.innerHTML='<p class="clarify-prompt"></p><input class="js-payee-filter"><div class="js-clarify-list"></div><button class="js-clarify-confirm" disabled>Confirm selection</button>';display.append(c);DctaAmbiguity.attach(c,[{id:'a',display_name:'Maya Tan',masked_account:'****1357'},{id:'b',display_name:'Maya Lim',masked_account:'****2468'}]);var d={id:'unresolved',unresolved:['payee'],amount:{value:'50.00',currency:'SGD'},source_account:'source'};DctaVoice.attachDraftReadback(c,d,false,index,validator,{decision:'hold'});return {card:c,draft:d,validator,policy:{decision:'hold'},index,anchor:c.querySelector('.js-hear-question')}}
 function fresh(){DctaVoice.reset();document.getElementById('send-btn').click();display.innerHTML='';spoken=[];active=0;overlaps=0}
 function resolve(item){var old=item.card,c=document.createElement('div');old.replaceChildren(c);var d={id:'new-server-id',amount:{value:'50.00',currency:'SGD'},payee:{id:'b',display_name:'Maya Lim',masked_account:'****2468'},source_account:'returned-source'};DctaVoice.resolvedCard(old,c,d,validator,policy);return c}
 var a,b;
 test('Two known payees read in order with complete details and validation status',()=>{fresh();a=known(0);b=known(1,{verdict:'freeze'});DctaVoice.queueCards([b,a]);assert(spoken.length===1&&spoken[0].text.includes('Transaction 1.')&&spoken[0].text.includes('Jane Tan')&&spoken[0].text.includes('5678')&&spoken[0].text.includes('30.00 SGD')&&spoken[0].text.includes('Validation: pass'),'Incomplete first draft');ended();assert(spoken.length===2&&spoken[1].text.includes('Transaction 2.')&&spoken[1].text.includes('Validation: freeze')&&overlaps===0,'Second draft wrong');ended()});
 test('Ambiguous first speaks candidates then pauses instead of reading Jane',()=>{fresh();a=ambiguous(0);b=known(1);DctaVoice.queueCards([a,b]);assert(spoken[0].text==='Transaction 1. I found Maya Tan ending in 1357 and Maya Lim ending in 2468. Which one did you mean?','Wrong actual candidate question');ended();assert(spoken.length===1&&b.card.isConnected&&!a.card.querySelector('.candidate-btn.selected'),'Question did not pause')});
 test('Question replay does not advance past unresolved payee',()=>{a.card.querySelector('.js-hear-question').click();ended();assert(spoken.length===2&&spoken.at(-1).text.includes('Which one'),'Replay advanced')});
 test('Server-confirmed resolved draft reads first, then waiting Jane; Jane data/node unchanged',()=>{var node=b.card,json=JSON.stringify(b),core=b.card.querySelector('.draft-core').outerHTML;var c=resolve(a);assert(spoken.at(-1).text.includes('Transaction 1.')&&spoken.at(-1).text.includes('Maya Lim')&&spoken.at(-1).text.includes('2468')&&spoken.at(-1).text.includes('50.00 SGD')&&spoken.at(-1).text.includes('Validation: pass'),'Resolved draft incomplete');var n=spoken.length;ended();assert(spoken.length===n+1&&spoken.at(-1).text.includes('Transaction 2.')&&spoken.at(-1).text.includes('Jane Tan'),'Jane did not follow resolved draft');assert(node===b.card&&core===b.card.querySelector('.draft-core').outerHTML&&JSON.stringify(b)===json,'Other draft changed');ended()});
 test('Ambiguous second reads known first, asks second question, then pauses',()=>{fresh();a=known(0);b=ambiguous(1);DctaVoice.queueCards([a,b]);assert(spoken[0].text.includes('Transaction 1.')&&!spoken[0].text.includes('Which one'),'Skipped known first');ended();assert(spoken.at(-1).text.includes('Transaction 2.')&&spoken.at(-1).text.includes('Which one'),'Missing later question');var n=spoken.length;ended();assert(spoken.length===n,'Later question did not pause')});
 test('Skip spoken review advances without resolving or confirming',()=>{fresh();a=ambiguous(0);b=known(1);var calls=0;a.card.querySelector('.js-clarify-confirm').addEventListener('click',()=>calls++);DctaVoice.queueCards([a,b]);a.card.querySelector('.js-review-continue').click();assert(spoken.at(-1).text.includes('Jane Tan')&&a.draft.unresolved[0]==='payee'&&calls===0&&!a.card.querySelector('.candidate-btn.selected'),'Skip changed transaction');ended()});
 test('A later unresolved item pauses too',()=>{fresh();a=ambiguous(0);b=ambiguous(1);DctaVoice.queueCards([a,b]);a.card.querySelector('.js-review-continue').click();var n=spoken.length;assert(spoken.at(-1).text.startsWith('Transaction 2.'),'Did not reach second question');ended();assert(spoken.length===n,'Second question auto-advanced')});
 test('Playback error retains manual replay/continue and never silently reads next item',()=>{fresh();a=known(0);b=known(1);DctaVoice.queueCards([a,b]);var n=spoken.length;spoken.at(-1).onerror();assert(spoken.length===n&&a.card.querySelector('.js-draft-readback').nextElementSibling.textContent.includes('did not complete'),'Error advanced');a.card.querySelector('.js-draft-readback').click();ended();assert(spoken.at(-1).text.startsWith('Transaction 2.'),'Successful replay did not resume');ended()});
 test('Silent playback timeout offers Continue without crossing a question barrier',()=>{fresh();a=ambiguous(0);b=known(1);var original=speechSynthesis.speak;speechSynthesis.speak=u=>{active++;spoken.push(u)};DctaVoice.queueCards([a,b]);var n=spoken.length;Array.from(timers.values()).forEach(fn=>fn());speechSynthesis.speak=original;assert(active===0&&spoken.length===n&&a.card.querySelector('.js-question-status').textContent.includes('did not complete'),'Silent block did not recover')});
 test('New message cancels active speech and invalidates old completions',()=>{var old=spoken.at(-1),n=spoken.length;document.getElementById('send-btn').click();old.onend();assert(spoken.length===n&&active===0,'Old continuation survived new message')});
 fresh();a=ambiguous(0);b=known(1);DctaVoice.queueCards([a,b]);var old=spoken.at(-1),n=spoken.length;a.card.remove();await new Promise(resolve=>queueMicrotask(resolve));
 test('Removing a card cancels active and pending review',()=>{old.onend();assert(active===0&&spoken.length===n,'Removed card kept talking')});
 test('Unsupported recognition leaves typing, tap choices and skip available',()=>{fresh();a=ambiguous(0);DctaVoice.queueCards([a]);assert(document.getElementById('mic-btn').disabled&&!document.getElementById('text-input').disabled&&a.card.querySelector('.js-answer-voice').disabled&&!a.card.querySelector('.js-review-continue').disabled,'No fallback')});
 test('A late replaced-card callback cannot interrupt the new message review',()=>{fresh();a=known(0);var old=a.card;old.remove();b=known(0);DctaVoice.queueCards([b]);var n=spoken.length;DctaVoice.resolvedCard(old,old,draft,validator,policy);assert(active===1&&spoken.length===n,'Stale callback interrupted new review')});
 test('Hiding the page cancels review and suppresses a delayed response',()=>{fresh();a=known(0);DctaVoice.queueCards([a]);Object.defineProperty(document,'hidden',{configurable:true,value:true});document.dispatchEvent(new Event('visibilitychange'));delete document.hidden;var n=spoken.length;DctaVoice.queueCards([a]);assert(active===0&&spoken.length===n,'Hidden-page cancellation revived')});
 test('Exactly one replay per card, full read-back repeats the amount twice',()=>{fresh();a=known(0);b=ambiguous(1);DctaVoice.attachDraftReadback(a.card,draft,false,0,validator,policy);assert(a.card.querySelectorAll('.js-draft-readback').length===1&&b.card.querySelectorAll('.js-draft-readback').length===1&&!display.querySelector('.js-readback'),'Duplicate replay');a.card.querySelector('.js-draft-readback').click();assert((spoken.at(-1).text.match(/30.00 SGD/g)||[]).length===2&&spoken.at(-1).text.includes('masked account ending 5678'),'Incomplete replay')});
 test('Skip is visible only at the active unresolved barrier and hidden after resolution/completion',()=>{fresh();a=known(0);b=ambiguous(1);DctaVoice.queueCards([a,b]);assert(a.continueButton.hidden&&b.continueButton.hidden,'Skip visible too soon');ended();assert(a.continueButton.hidden&&!b.continueButton.hidden,'Wrong barrier skip');ended();var c=resolve(b);assert(c.querySelector('.js-review-continue').hidden,'Resolved skip visible');ended();assert(c.querySelector('.js-review-continue').hidden,'Completed skip visible')});
 test('End without start is failure, not completion or advancement',()=>{fresh();a=known(0);b=known(1);var original=speechSynthesis.speak;speechSynthesis.speak=u=>spoken.push(u);DctaVoice.queueCards([a,b]);spoken.at(-1).onend();speechSynthesis.speak=original;assert(spoken.length===1&&a.card.querySelector('.js-draft-readback').nextElementSibling.textContent.includes('did not complete')&&!a.note.textContent.includes('finished'),'False completion')});
 test('Started but stalled speech times out without advancing or reporting finished',()=>{fresh();a=known(0);b=known(1);DctaVoice.queueCards([a,b]);Array.from(timers.values()).forEach(fn=>fn());assert(active===0&&spoken.length===1&&a.card.querySelector('.js-draft-readback').nextElementSibling.textContent.includes('did not complete')&&!a.note.textContent.includes('finished'),'Stall falsely completed')});
 test('Hidden-tab cancellation retains current-message review for manual resolved draft replay',()=>{fresh();a=ambiguous(0);b=known(1);DctaVoice.queueCards([a,b]);Object.defineProperty(document,'hidden',{configurable:true,value:true});document.dispatchEvent(new Event('visibilitychange'));delete document.hidden;var n=spoken.length,c=resolve(a);assert(spoken.length===n&&c.querySelector('.js-conversation-status').textContent.includes('paused'),'Hidden review auto-resumed/lost');c.querySelector('.js-draft-readback').click();assert(spoken.at(-1).text.includes('Transaction 1.')&&spoken.at(-1).text.includes('Maya Lim'),'Resolved draft missing');ended();assert(spoken.at(-1).text.includes('Transaction 2.')&&spoken.at(-1).text.includes('Jane Tan'),'Waiting Jane lost');ended()});
 test('Explicit async replacement retains the queue across detached old card and hash wait',()=>{fresh();var host=document.createElement('div');host.id='api-item-0';display.append(host);a=ambiguous(0);host.append(a.card);b=known(1);DctaVoice.queueCards([a,b]);var old=a.card;DctaVoice.replacingCard(old);old.remove();var c=document.createElement('div');host.append(c);DctaVoice.resolvedCard(old,c,{...draft,id:'new-id',payee:{display_name:'Maya Lim',masked_account:'****2468'}},validator,policy);assert(spoken.at(-1).text.includes('Maya Lim'),'Replacement lost');ended();assert(spoken.at(-1).text.includes('Transaction 2.'),'Replacement lost Jane');ended()});
 fresh();a=known(0);b=known(1);DctaVoice.queueCards([a,b]);ended();a.card.remove();await new Promise(resolve=>queueMicrotask(resolve));
 test('Removing a completed earlier card does not cancel the active later narration',()=>{assert(spoken.at(-1).text.startsWith('Transaction 2.')&&active===1,'Earlier card interrupted later review');ended()});
 test('Speech never submits, signs, executes or treats yes as authorization',()=>{fresh();var calls=0;document.getElementById('send-btn').addEventListener('click',()=>calls++);a=known(0);DctaVoice.queueCards([a]);assert(calls===0&&spoken.at(-1).text.includes('never signs or executes'),'Audio authorized')});
 DctaVoice.reset();window.conversationTestResults=results;document.getElementById('test-results').textContent=JSON.stringify(results,null,2);
})();
</script>
