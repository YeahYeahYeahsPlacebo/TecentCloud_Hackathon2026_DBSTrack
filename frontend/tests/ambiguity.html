<!doctype html><meta charset="utf-8"><title>Ambiguity voice regression tests</title>
<!-- Deterministic lifecycle/matching test doubles; no speech service or transaction API calls. -->
<textarea id="text-input">Original message</textarea><button id="send-btn">Send</button><button id="mic-btn">Mic</button>
<p id="voice-status"></p><p id="voice-preview"></p><div id="draft-display"></div><pre id="test-results">Running</pre>
<script>
var recognizers=[],spoken=[],cancellations=0,speechActive=false;
window.SpeechRecognition=class{
 constructor(){recognizers.push(this)}start(){this.ttsAtStart=speechActive;this.onstart()}stop(){}abort(){this.aborted=true}
};
window.SpeechSynthesisUtterance=class{constructor(text){this.text=text}};
Object.defineProperty(window,'speechSynthesis',{value:{speak(u){speechActive=true;spoken.push(u);u.onstart()},cancel(){speechActive=false;cancellations++}},configurable:true});
</script>
<script src="../js/voice.js"></script><script src="../js/ambiguity.js"></script>
<script>
(async function(){
 var results=[];
 function test(name,fn){try{fn();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}}
 function assert(x,message){if(!x)throw Error(message)}
 var candidates=[{id:'a',display_name:'Maya Tan',masked_account:'****1357'},{id:'b',display_name:'Maya Lim',masked_account:'****2468'},{id:'c',display_name:'Maya Ng',masked_account:'****9753'}];
 function card(){
  var root=document.createElement('div');root.className='clarify-card';
  root.innerHTML='<p class="clarify-prompt"></p><input class="js-payee-filter"><div class="js-clarify-list"></div><button class="js-clarify-confirm" disabled>Confirm selection</button>';
  candidates.forEach(function(c){var button=document.createElement('button');button.className='candidate-btn';button.dataset.candidateId=c.id;button.innerHTML='<span class="candidate-check"></span>';button.addEventListener('click',function(){root.querySelectorAll('.candidate-btn').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');root.querySelector('.js-clarify-confirm').disabled=false});root.querySelector('.js-clarify-list').append(button)});
  document.getElementById('draft-display').append(root);DctaAmbiguity.attach(root,candidates);DctaVoice.attachDraftReadback(root,{amount:{value:'50.00',currency:'SGD'},source_account:'source'},false,0,{verdict:'freeze'},{decision:'hold'});return root;
 }
 DctaVoice.init();var a=card(),b=card();
 function answer(root,text){root.querySelector('.js-answer-voice').click();var r=recognizers.at(-1);r.onresult({results:[{0:{transcript:text},isFinal:true}]});if(root.querySelector('.js-answer-voice').getAttribute('aria-pressed')==='true')root.querySelector('.js-answer-voice').click();r.onend();return r}
 function selected(root){return root.querySelector('.candidate-btn.selected')?.dataset.candidateId}
 test('Question uses supplied names and suffixes',()=>assert(a.querySelector('.clarify-prompt').textContent==='I found Maya Tan ending in 1357, Maya Lim ending in 2468 and Maya Ng ending in 9753. Which one did you mean?','Wrong question'));
 test('Single Read draft includes that card question',()=>{a.querySelector('.js-hear-question').click();assert(spoken.at(-1).text.includes(a.querySelector('.clarify-prompt').textContent)&&a.querySelectorAll('.js-draft-readback').length===1,'Wrong audio')});
 test('Unique final name naturally stops and highlights without a Finish click',()=>{a.querySelector('.js-answer-voice').click();let r=recognizers.at(-1);r.onresult({results:[{0:{transcript:'Maya Lim'},isFinal:true}]});assert(!r.ttsAtStart&&selected(a)==='b'&&a.querySelector('.js-answer-voice').getAttribute('aria-pressed')==='false','Speech was active at mic start or did not stop naturally');r.onend()});
 test('Unique full suffix selects offered ID',()=>{answer(b,'ending in 1357');assert(selected(b)==='a','Wrong suffix')});
 test('Spoken digit suffix including one is supported',()=>{answer(b,'one three five seven');assert(selected(b)==='a','Spoken suffix lost digits')});
 test('Two cards keep heard words and selection separate',()=>{assert(selected(a)==='b'&&selected(b)==='a','Selections crossed');assert(a.querySelector('.js-answer-heard').textContent.includes('Maya Lim')&&!a.querySelector('.js-answer-heard').textContent.includes('one three'),'Heard text crossed')});
 test('Unclear answer preserves selection and offers Retry plus taps',()=>{answer(a,'whatever');assert(selected(a)==='b'&&a.querySelector('.js-answer-voice').textContent.includes('Retry'),'Unclear changed selection');a.querySelector('.candidate-btn').click();assert(selected(a)==='a','Tap unavailable')});
 test('Spoken yes never selects or confirms a payee',()=>{var calls=0;a.querySelector('.js-clarify-confirm').addEventListener('click',()=>calls++);answer(a,'yes');assert(selected(a)==='a'&&calls===0,'Yes changed or authorized selection')});
 test('Shared name is ambiguous',()=>{answer(a,'Maya');assert(selected(a)==='a'&&a.querySelector('.js-answer-status').textContent.includes('more than one'),'Partial name changed selection')});
 test('Partial suffix, unknown name, negation and conflicting clues fail closed',()=>{for(let word of ['135','not Maya Lim','Maya Tan ending in 2468','Maya Lim or Maya Tan','someone else'])assert(DctaAmbiguity.matchAnswer(word,candidates).length!==1,word+' selected')});
 test('New card microphone cancels old one and ignores late answer',()=>{a.querySelector('.js-answer-voice').click();let old=recognizers.at(-1);b.querySelector('.js-answer-voice').click();old.onresult({results:[{0:{transcript:'Maya Tan'},isFinal:true}]});old.onend();assert(old.aborted&&selected(a)==='a','Stale answer changed selection');DctaVoice.reset()});
 test('Full draft read-back repeats only the server amount and shares audio cancellation',()=>{
  var amountCard=document.createElement('div');document.getElementById('draft-display').append(amountCard);
  DctaVoice.attachDraftReadback(amountCard,{amount:{value:'73.25',currency:'SGD'},source_account:'source'},false,0);
  var read=amountCard.querySelector('.js-draft-readback');read.click();
  assert((spoken.at(-1).text.match(/73.25 SGD/g)||[]).length===2,'Amount read-back changed');
  var before=cancellations;a.querySelector('.js-hear-question').click();
  assert(cancellations===before+1&&read.textContent==='Read draft','Audio queues overlapped');
 });
 test('New-draft read-back uses only returned details without confirming anything',()=>{
  var returned=document.createElement('div');document.getElementById('draft-display').append(returned);
  DctaVoice.attachDraftReadback(returned,{amount:{value:'91.00',currency:'SGD'},payee:{display_name:'Ada Wong',masked_account:'****8642'},source_account:'source-test'},true);
  assert(spoken.at(-1).text.includes('91.00 SGD')&&spoken.at(-1).text.includes('Ada Wong')&&spoken.at(-1).text.includes('8642')&&spoken.at(-1).text.includes('source-test'),'Read-back used stale details');
  assert(spoken.at(-1).text.includes('never signs or executes'),'Missing authorization boundary');
 });
 test('Native end without any results clears listening and reports the observed browser phase',()=>{var c=card();c.querySelector('.js-answer-voice').click();var r=recognizers.at(-1);r.onaudiostart();r.onspeechstart();r.onend();assert(c.querySelector('.js-answer-heard').textContent.includes('no final words')&&c.querySelector('.js-answer-status').textContent.includes('speech detected')&&!selected(c),'No-result lifecycle hidden');c.remove()});
 test('Speech-service network failure is distinguishable from silence and never guesses',()=>{var c=card();c.querySelector('.js-answer-voice').click();var r=recognizers.at(-1);r.onerror({error:'network'});r.onend();assert(c.querySelector('.js-answer-status').textContent.includes('(network)')&&c.querySelector('.js-answer-heard').textContent.includes('no final words')&&!selected(c),'Network error erased');c.remove()});
 test('Permission/startup delay is not counted as the 15-second listening window',()=>{var c=card(),original=SpeechRecognition.prototype.start;SpeechRecognition.prototype.start=function(){};var set=window.setTimeout,clear=window.clearTimeout,callbacks=new Map(),id=0;window.setTimeout=(fn,ms)=>{callbacks.set(++id,{fn,ms});return id};window.clearTimeout=id=>callbacks.delete(id);c.querySelector('.js-answer-voice').click();var r=recognizers.at(-1);assert(c.querySelector('.js-answer-heard').textContent.includes('waiting for Chrome')&&[...callbacks.values()].some(x=>x.ms===45000)&&![...callbacks.values()].some(x=>x.ms===15000),'Premature listening/timer');r.onstart();assert(c.querySelector('.js-answer-heard').textContent.includes('listening')&&[...callbacks.values()].some(x=>x.ms===15000),'Listening not armed at native start');DctaVoice.reset();window.setTimeout=set;window.clearTimeout=clear;SpeechRecognition.prototype.start=original;c.remove()});
 test('A late final after manual Stop still selects only the offered unique candidate',()=>{var c=card();c.querySelector('.js-answer-voice').click();var r=recognizers.at(-1);c.querySelector('.js-answer-voice').click();r.onresult({results:[{0:{transcript:'Maya Lim'},isFinal:true}]});r.onend();assert(selected(c)==='b'&&c.querySelector('.js-answer-voice').getAttribute('aria-pressed')==='false','Late final lost');c.remove()});
 test('Microphone waits until asynchronous native speech cancellation has settled',()=>{var c=card(),busy=true,count=recognizers.length,set=window.setTimeout,clear=window.clearTimeout,callbacks=new Map(),id=0;Object.defineProperty(speechSynthesis,'speaking',{configurable:true,get:()=>busy});window.setTimeout=(fn,ms)=>{callbacks.set(++id,{fn,ms});return id};window.clearTimeout=id=>callbacks.delete(id);c.querySelector('.js-answer-voice').click();assert(recognizers.length===count&&c.querySelector('.js-answer-status').textContent.includes('Stopping spoken'),'Mic started over speech');busy=false;[...callbacks.values()].find(x=>x.ms===100).fn();assert(recognizers.length===count+1&&!recognizers.at(-1).ttsAtStart,'Mic never started after cancellation');DctaVoice.reset();delete speechSynthesis.speaking;window.setTimeout=set;window.clearTimeout=clear;c.remove()});
 test('Voice never edits the main message',()=>assert(document.getElementById('text-input').value==='Original message','Message overwritten'));
 test('No automatic confirmation',()=>{let count=0;for(let root of [a,b])root.querySelector('.js-clarify-confirm').addEventListener('click',()=>count++);answer(a,'Maya Lim');assert(count===0&&!a.querySelector('.js-clarify-confirm').disabled,'Auto confirmation')});
 test('Silence, permission denial and recognition errors preserve selection and offer Retry',()=>{for(let error of ['no-speech','not-allowed','network']){a.querySelector('.js-answer-voice').click();let r=recognizers.at(-1);r.onerror({error});r.onend();assert(selected(a)==='b'&&a.querySelector('.js-answer-voice').textContent.includes('Retry'),'Error changed selection: '+error)}});
 test('Interim or partial shared name never commits to a new selection',()=>{a.querySelector('.js-answer-voice').click();let r=recognizers.at(-1);r.onresult({results:[{0:{transcript:'Maya'},isFinal:false}]});assert(selected(a)==='b'&&a.querySelector('.js-answer-voice').getAttribute('aria-pressed')==='true','Interim committed');r.onresult({results:[{0:{transcript:'Maya'},isFinal:true}]});assert(selected(a)==='b','Partial final committed');r.onend();assert(a.querySelector('.js-answer-voice').textContent.includes('Retry'),'No retry')});
 test('A replaced card ignores late final and end callbacks',()=>{a.querySelector('.js-answer-voice').click();let r=recognizers.at(-1);a.remove();r.onresult({results:[{0:{transcript:'Maya Tan'},isFinal:true}]});r.onend();assert(selected(a)==='b','Detached card accepted answer');DctaVoice.reset()});
 test('Stop listening remains a fallback for an unclear answer',()=>{var c=card();c.querySelector('.js-answer-voice').click();var r=recognizers.at(-1);r.onresult({results:[{0:{transcript:'Maya'},isFinal:true}]});assert(c.querySelector('.js-answer-voice').textContent==='Stop listening','No Stop fallback');c.querySelector('.js-answer-voice').click();r.onend();assert(!selected(c)&&c.querySelector('.js-answer-voice').textContent.includes('Retry'),'Stop committed an unclear answer')});
 // A fresh realm loads voice.js with recognition explicitly unavailable.
 var frame=document.createElement('iframe');document.body.append(frame);
 frame.srcdoc='<textarea id="text-input"></textarea><button id="send-btn"></button><button id="mic-btn"></button><p id="voice-status"></p><p id="voice-preview"></p><div id="draft-display"></div><script>window.SpeechRecognition=undefined;window.webkitSpeechRecognition=undefined;<\/script><script src="/js/voice.js"><\/script><script> DctaVoice.init();parent.postMessage("unsupported-ready",location.origin);<\/script>';
 await new Promise(resolve=>frame.onload=resolve);
 test('Recognition unavailable leaves tap selection available',()=>{var w=frame.contentWindow;assert(w.document.getElementById('mic-btn').disabled,'Mic supported unexpectedly');var disabled=w.document.createElement('button'),note=w.document.createElement('p');w.DctaVoice.wireAnswer({button:disabled,status:note,card:w.document.body});assert(disabled.disabled&&note.textContent.includes('Tap a payee'),'No fallback')});
 window.ambiguityTestResults=results;document.getElementById('test-results').textContent=JSON.stringify(results,null,2);
})();
</script>
